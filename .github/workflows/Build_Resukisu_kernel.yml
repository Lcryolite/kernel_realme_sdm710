name: Build BloodMoon A17 ReSukiSU Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Lcryolite
      KBUILD_BUILD_HOST: Lcryolite
      KERNEL_DEFCONFIG: sdm670-perf_defconfig
      PROTON_CLANG_COMMIT: 9fb011b183fe7e69b04b873ef6533b4b077e3c5e

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache zip

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: ${{ runner.os }}-kernel-ccache

      - name: Clone Proton Clang
        run: |
          git init clang
          git -C clang remote add origin https://github.com/kdrag0n/proton-clang.git
          git -C clang fetch --depth=1 origin "$PROTON_CLANG_COMMIT"
          git -C clang checkout --detach FETCH_HEAD
          rm -f clang/bin/as clang/bin/ld clang/bin/ld.bfd

      - name: Verify pinned ReSukiSU
        run: |
          test "$(git -C KernelSU rev-parse HEAD)" = "97163bdc8ad2ee59b523e9e34edeb4c286eceb04"
          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"

      - name: Generate defconfig
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          rm -rf out/
          make O=out ARCH=$ARCH CC="ccache clang" CLANG_TRIPLE=$CROSS_COMPILE \
            CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            $KERNEL_DEFCONFIG
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^# CONFIG_KSU_SUSFS is not set$' out/.config
          grep -q '^# CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE is not set$' out/.config

      - name: Compile Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make -j$(nproc) O=out ARCH=$ARCH CC="ccache clang" CLANG_TRIPLE=$CROSS_COMPILE \
            CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            Image.gz
          test -f out/arch/arm64/boot/Image.gz
          strings out/vmlinux | grep -q 'v4.1.0-97163bdc@ReSukiSU'
          test "$(make -s O=out ARCH=$ARCH kernelrelease)" = "4.9.337+67-BloodMoon"

      - name: Package with AnyKernel3
        run: |
          TIME=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)
          rm -f AnyKernel3/Image.gz AnyKernel3/Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="RMX1901-BloodMoon-A17-ReSukiSU-${TIME}.zip"
          zip -r9 "../${ZIP_NAME}" . -x '.git/*' 'README.md' '*placeholder'
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=a17-${TIME}" >> "$GITHUB_ENV"

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kernel Release ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
