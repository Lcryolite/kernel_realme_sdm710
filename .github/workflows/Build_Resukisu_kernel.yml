name: Build RMX1901 A17 ReSukiSU Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Lcryolite
      KBUILD_BUILD_HOST: Lcryolite
      KERNEL_DEFCONFIG: sdm670-perf_defconfig
      LLVM_VERSION: 22.1.8
      LLVM_ARCHIVE_SHA256: 8d5d1e52a06e1c10e457fd36489047053ac451ddad9c88017b0d0fc6b8e5d4c0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            ccache curl xz-utils zip

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          max-size: 2G
          key: ${{ runner.os }}-clang22-kernel-ccache

      - name: Install pinned LLVM 22 toolchain
        run: |
          LLVM_ARCHIVE="llvm-${LLVM_VERSION}-x86_64.tar.xz"
          LLVM_URL="https://www.kernel.org/pub/tools/llvm/files/${LLVM_ARCHIVE}"
          LLVM_DIR="${RUNNER_TEMP}/llvm-${LLVM_VERSION}"
          curl -fL --retry 3 -o "${RUNNER_TEMP}/${LLVM_ARCHIVE}" "${LLVM_URL}"
          echo "${LLVM_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${LLVM_ARCHIVE}" | sha256sum -c -
          mkdir -p "${LLVM_DIR}"
          tar -xJf "${RUNNER_TEMP}/${LLVM_ARCHIVE}" -C "${LLVM_DIR}" --strip-components=1
          "${LLVM_DIR}/bin/clang" --version | head -n 1 | grep -F "clang version ${LLVM_VERSION}"
          "${LLVM_DIR}/bin/ld.lld" --version | head -n 1 | grep -F "LLD ${LLVM_VERSION}"
          echo "${LLVM_DIR}/bin" >> "$GITHUB_PATH"

      - name: Verify pinned ReSukiSU
        run: |
          test "$(git -C ReSukiSU rev-parse HEAD)" = "faccf4c5edc7be37776216e7d43dd3dca0239331"
          test "$(readlink drivers/kernelsu)" = "../ReSukiSU/kernel"

      - name: Compile kernel with Clang 22
        run: |
          OUT_DIR=out ./build-clang22.sh
          test -s out/arch/arm64/boot/Image.gz
          grep -aFq 'clang version 22.1.8' out/vmlinux
          grep -aFq 'v4.2.0-rc1-faccf4c5@ReSukiSU' out/vmlinux
          test "$(cat out/include/config/kernel.release)" = "4.9.337+67-RMX1901-A17-ReSukiSU"

      - name: Package with AnyKernel3
        run: |
          TIME=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)
          rm -f AnyKernel3/Image.gz AnyKernel3/Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          ZIP_NAME="RMX1901-A17-ReSukiSU-${TIME}.zip"
          zip -r9 "../${ZIP_NAME}" . -x '.git/*' 'README.md' '*placeholder'
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=a17-clang22-${TIME}" >> "$GITHUB_ENV"

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kernel Release ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
