name: Build Resukisu Kernel With Docker & LXC
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-none-eabi-
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Lcryolite
      KBUILD_BUILD_HOST: Lcryolite
      LLVM: 1
      LLVM_IAS: 1
      LD: ld.lld
      KBUILD_LTO_CLANG: 1
      HOST_ARGS: HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld HOSTAR=/usr/bin/ar
      KERNEL_DEFCONFIG: sdm710_defconfig

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-none-eabi ccache zip

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: ${{ runner.os }}-kernel-ccache

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          rm -f clang/bin/as clang/bin/ld clang/bin/ld.bfd clang/bin/ld.gold

      - name: Fetch KernelSU
        run: |
          if [ ! -d "drivers/kernelsu" ]; then
            git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
            bash KernelSU/kernel/setup.sh main
          fi

      - name: Inject Docker & LXC Configs
        run: |
          CONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"

          echo "clean conflict..."
          sed -i '/# CONFIG_PID_NS is not set/d' $CONFIG_FILE
          sed -i '/# CONFIG_FHANDLE is not set/d' $CONFIG_FILE
          sed -i '/# CONFIG_BRIDGE is not set/d' $CONFIG_FILE
          sed -i '/CONFIG_USER_NS/d' $CONFIG_FILE

          echo "Injecting Docker & LXC Configs..."
          cat << 'EOF' >> $CONFIG_FILE
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_NET_NS=y
          CONFIG_FHANDLE=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_KEYS=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_VETH=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          # ==========================================
          EOF

      - name: Patch vDSO & KernelSU Config
        run: |
          CONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
          git checkout arch/arm64/kernel/vdso32/Makefile 2>/dev/null || true
          echo "ccflags-y += -fuse-ld=lld" >> arch/arm64/kernel/vdso32/Makefile
          echo "VDSO_LDFLAGS += -fuse-ld=lld" >> arch/arm64/kernel/vdso32/Makefile

          sed -i '/CONFIG_KSU/d' $CONFIG_FILE
          echo "CONFIG_KSU=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" >> $CONFIG_FILE

      - name: Generate defconfig
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KERNEL_CMDLINE="ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 O=out"

          rm -rf out/
          make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang" $HOST_ARGS
          sed -i 's/CONFIG_VDSO32=y/# CONFIG_VDSO32 is not set/g' out/.config

      - name: Compile Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KERNEL_CMDLINE="ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 O=out"

          make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc) $HOST_ARGS

      - name: Package with AnyKernel3
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            TIME=$(TZ=GMT+08 date +%m%d%H%M)
            rm -f AnyKernel3/Image.gz-dtb
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
            cd AnyKernel3
            ZIP_NAME="RMX1901-ReSuki-Lcryolite-LXC&Docker-${TIME}.zip"
            zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
            cd ..
            echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
            echo "RELEASE_TAG=v${TIME}" >> $GITHUB_ENV
          else
            echo "Kernel compilation failed! Image.gz-dtb not found."
            exit 1
          fi

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kernel Release ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
